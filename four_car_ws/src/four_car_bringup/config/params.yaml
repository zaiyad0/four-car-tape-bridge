# ============================================================
#  四车协同 · 卷尺桥 —— 所有可调参数
#  改角度、改距离、改速度只动这一个文件，不碰代码
#
#  待填项标了 TODO。物料到位后按 §8 清单补齐。
# ============================================================

/**:
  ros__parameters:

    # ---------------- 全局 ----------------
    car_id: 1                  # 本车编号 1~4。由 launch 用 CAR_ID 环境变量覆盖
    status_period: 1.0         # 状态上报周期 (s)。必须周期性重发，不能只发一次

    # ---------------- 任务时序 ----------------
    mission:
      drive_distance_m: 3.0    # 前车要直行多少米          <- TODO: 实际量一下
      yaw_tolerance_deg: 2.0   # 转向到这个误差内就算到位
      turn_speed_rad_s: 0.5    # 转向角速度
      drive_speed_m_s: 0.25    # 直行速度
      settle_time: 0.5         # 到位后停稳再上报 (s)
      mission_timeout: 30.0    # 主节点等一台车的最长时间 (s)

    # 每台车的目标朝向（度，0 = 初始朝向，逆时针为正）
    # 初始 4 台车一行并排朝同一方向，然后各自转向对面：
    #   1 右转 90 面对 2 ；2 左转 90 面对 1
    #   3 右转 90 面对 4 ；4 左转 90 面对 3
    target_yaw_deg:
      car1: 90.0
      car2: -90.0
      car3: 90.0
      car4: -90.0

    # 哪些车需要先直行（前两台），哪些原地转（后两台）
    cars_that_drive: [1, 2]
    # 配对关系：谁和谁面对面（决定谁伸卷尺、跟谁吸合）
    # ⚠️ ROS 2 参数不支持嵌套数组，所以拍平表示，两两一组：(1,2) (3,4)
    pairs_flat: [1, 2, 3, 4]

    # ---------------- 底盘：4 个 ZDT_M370 闭环伺服 + 麦轮 ----------------
    base:
      # 麦轮几何（米）—— 用户实测
      wheel_radius: 0.0485    # 麦轮直径 97mm / 2
      half_length: 0.08006    # 前后中心距 160.12mm / 2
      half_width: 0.1385      # 左右距离 277mm / 2
      # 轮子最大角速度。电机输出轴上限 ≈160 RPM（3000电机RPM/18.8）
      # → 16.7 rad/s ≈ 车速 0.81 m/s。留余量取 16.0
      # （本任务只需要 0.25 m/s，远在能力范围内）
      max_wheel_rad_s: 16.0

      # 麦轮符号标定 —— 实车方向不对就翻对应的开关（见 架构方案 §6.4）
      flip_vy: false
      flip_wz: false

      # ---- 串口 ----
      # ⚠️ 车上有两个串口设备，**别搞混**：
      #     底盘  →  这个（USB 转 TTL/RS485，插上就是 /dev/ttyUSB0）
      #     舵机  →  /dev/ttyAMA0（GPIO14/15，物理脚 8/10）见下面 arm.servo_port
      # 也可以用 Pi 5 的额外硬件串口 /dev/ttyAMA2~4（需 dtoverlay 开启）
      port: "/dev/ttyUSB0"
      baudrate: 115200        # ZDT 出厂默认

      # ---- 电机 ----
      # 520 减速电机。**这个值要写进驱动器**（不是树莓派自己算）：
      #   手册 5.5.7：设置减速比后，所有速度和位置都按它自动缩放，对应输出轴
      #   setup_gear=true 时，节点开机会自动把驱动器设成这个值
      #   （设错 = 车速差 18.8 倍，所以开机日志里一定要看"减速比检查"那行）
      gear_ratio: 18.8
      setup_gear: true
      # 轮位 → 电机地址。地址靠 zdt_id_tool.py 探测/设置
      addr_map: [1, 2, 3, 4]  # FL, FR, RL, RR
      # 哪几个轮子的正转方向跟「车前进」相反（麦轮左右镜像时通常要翻）
      # 逗号分隔的字符串（不能用数组 —— ROS 2 参数空数组推断不出元素类型）
      # 例：invert: "FL,RL"        <- 标定后填
      invert: ""
      accel_rpm_s: 2000       # 加速度 (RPM/S)，越大起步越猛
      max_motor_rpm: 3000.0   # 电机轴最大转速
      use_current_limit: false  # true = 用 C6 限流模式（防堵转烧电机）
      max_current_ma: 3000

      # ---- 控制环 ----
      control_hz: 30.0        # cmd_vel → 串口 的发送频率
      # ⚠️ odom_hz 别超 20：每个周期要挨个问 4 个电机的实时转速，
      #    一轮 10~30ms。设太高会让回调堆积。
      odom_hz: 20.0
      cmd_timeout: 0.5        # 多久没收到 cmd_vel 就自动停车（安全）

    # ---------------- 上层：卷尺伸出 + 电磁铁 ----------------
    # 控制思路：**通电 N 秒就停**。不用编码器、不用霍尔、不用标定表。
    # N 由实测确定：从短开始，一点点加，看到卷尺伸到位就记下来。
    arm:
      # 俯仰舵机（总线舵机）—— 跟底盘电机是两回事，串口也不同
      servo_port: "/dev/ttyAMA0"   # ← 舵机的串口（底盘是 /dev/ttyUSB0）
      servo_baudrate: 9600
      servo_id: 1
      servo_pitch_deg: 0.0         # 水平。按机械结构调整，只需开机设一次

      # ---- 卷尺电机 JGY-370 (24 RPM) + L298N ----
      # L298N 一路三根线：ENA 调速 + IN1/IN2 定方向
      # ⚠️ L298N 的 ENA 跳线帽要**拔掉**，不然 ENA 常高，PWM 不起作用
      ena_pin: 12                  # PWM 调速   <- TODO: 按实际接线改
      in1_pin: 23                  # 方向
      in2_pin: 24                  # 方向
      pwm_freq: 1000               # Hz

      # ★★ 唯一要你实测的参数 ★★
      # JGY-370 输出轴 24 RPM → 转一圈 2.5 秒
      # 起始估法：需要转几圈 × 2.5 = 秒数
      #   例：要转 4 圈 → 10 秒
      # 然后从短开始加，每次 +1 秒，看到刚好伸到位就定下来
      extend_seconds: 8.0
      retract_seconds: 8.0         # 收回时间（可以给长一点，收到底靠堵转停）
      # 占空比 90%。注意：占空比降了转速也降，所以同样的时间走的距离变短，
      # 标定 extend_seconds 时要按当前占空比来测。
      #   90% 占空比 → 转速约 24×0.9 ≈ 21.6 RPM → 每圈约 2.78 秒
      extend_duty: 0.9
      retract_duty: 0.9

      # ---- 电磁铁 ----
      # ⚠️ GPIO 不能直接拉电磁铁（电流不够且会烧引脚），要经驱动模块
      magnet_pin: 17
      magnet_active_high: true     # 继电器模块常常是低电平触发，那种填 false
      magnet_settle: 1.0           # 通电后等多久算吸稳 (s)

    # ---------------- 安全 ----------------
    safety:
      estop_enabled: true
      estop_topic: "/emergency_stop"   # 收到任何消息就全部停下
      max_continuous_run_s: 120.0      # 单次任务最长运行时间，超时自动停
